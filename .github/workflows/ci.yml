name: CI

# Every push to master, or by hand from the Actions tab (Run workflow).
on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Runs queue instead of cancelling each other, so a push is never cut off half-way.
concurrency:
  group: ci-master
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Docker Hub repository under DOCKER_USERNAME.
  IMAGE_NAME: jedediah
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  verify:
    name: Vet, generate, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go vet ./...

      # The generated *_templ.go files are committed; fail if one is stale.
      - name: templ generate is up to date
        run: |
          go tool templ generate
          git diff --exit-code

      - run: go test ./...

  image:
    name: Docker image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags too, for git describe

      # The version the app shows, worked out as in Taskfile.yml.
      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: DockerHub > login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: DockerHub > push (${{ env.BUILD_NUMBER }})
        uses: docker/build-push-action@v7
        with:
          context: .
          # The Dockerfile cross-compiles, so arm64 (Apple silicon, Raspberry Pi) needs no QEMU.
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.BUILD_NUMBER }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
